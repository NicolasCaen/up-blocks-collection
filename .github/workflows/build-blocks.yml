name: Release Plugin

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm install
          npm install @wordpress/scripts@30.8.1 --save-dev
        
      - name: Build
        run: npm run build
        
      - name: Create plugin archive
        run: |
          # Create a clean directory for the plugin
          mkdir ng1-blocks-collection
          
          # Copy only the necessary files
          cp -r build/* ng1-blocks-collection/
          cp *.php ng1-blocks-collection/
          cp readme.txt ng1-blocks-collection/
          cp LICENSE ng1-blocks-collection/
          cp README.md ng1-blocks-collection/
          
          # Create ZIP file
          zip -r ng1-blocks-collection.zip ng1-blocks-collection
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ng1-blocks-collection.zip