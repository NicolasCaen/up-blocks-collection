name: Build Gutenberg Blocks on Release

on:
  release:
    types: [published]  # Déclenche l'action uniquement lors de la publication d'une release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Configurer Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: npm install

      # Étape 4 : Builder les blocs
      - name: Build blocks
        run: npm run build

      # Étape 5 : Compresser les fichiers compilés
      - name: Compress build artifacts
        run: |
          zip -r build.zip build/*/

      # Étape 6 : Ajouter les fichiers compilés à la release
      - name: Upload build artifacts to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build.zip
          asset_name: build.zip
          asset_content_type: application/zip